<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Sentinel</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-body">
  <main class="login-card">
    <p class="eyebrow">Local · encrypted · no cloud</p>
    <h1>Sentinel</h1>
    <p class="lede">Automated document review for patient insurance claims. Everything stays on this machine.</p>
    {% if error %}
    <p class="banner bad">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login" class="stack">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>Username
        <input name="username" autocomplete="username" required>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary">Sign in</button>
    </form>
    <div class="demo">
      <p>Demo accounts</p>
      <ul>
        <li><code>reviewer</code> / <code>reviewer123</code> — claims desk</li>
        <li><code>patient</code> / <code>patient123</code> — Maya Chen</li>
      </ul>
    </div>
  </main>
</body>
</html>
